apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aks-demo-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aks-demo

  minReplicas: 1
  maxReplicas: 2   # Max pods = 2

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50   #  scale when CPU > 50%