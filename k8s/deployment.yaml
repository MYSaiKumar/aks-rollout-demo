apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-demo
  namespace: AKS-ROLL-OUT-DEMO
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: aks-demo

  template:
    metadata:
      labels:
        app: aks-demo
    spec:
      containers:
      - name: aks-demo
        image: vkraftacr123.azurecr.io/myapp:latest   #GitHub will update tag
        imagePullPolicy: Always
        ports:
        - containerPort: 5000

        resources:
          requests:
            cpu: "100m"
          limits:
            cpu: "200m"